\* expect: pass
\* module: SessionLifecycle
\* Target design (D1-D8 plus forwardStale): every transition, three in a row, the primary's and a subagent's read-guard writers in flight, one turn.
CONSTANTS
    Transitions = {"New","Resume","Fork","Clone","CancelFork","Reload","Quit","PiFork","Tree","IdleReset","SecStart","SecEnd","Dup"}
    Writers = {"read","secRead"}
    FixParts = {"entryCapture","handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 3
    MaxTurns = 1
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

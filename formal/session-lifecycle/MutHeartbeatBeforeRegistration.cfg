\* expect: violated NoCrossSessionState
\* module: SessionLifecycle
\* Registry family (#3498, #3587): a heartbeat resolves its root from the process intent before the new session's queued registration lands, and re-registers the ended session's root.
CONSTANTS
    Transitions = {"New"}
    Writers = {"heartbeat"}
    FixParts = {"handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 1
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

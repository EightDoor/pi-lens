\* expect: violated NoCrossSessionState
\* module: SessionLifecycle
\* #3596 (and the #3528 drain shape): a tool_result writer resolves its session when it lands, after its upstream await, and writes session 1's read into session 2.
CONSTANTS
    Transitions = {"New"}
    Writers = {"read"}
    FixParts = {"handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 1
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

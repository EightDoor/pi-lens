\* expect: pass
\* module: SessionLifecycle
\* Target design: the registry heartbeat and LSP work in flight across /new, resume, /reload, the LSP idle reset, quit and pi --fork.
CONSTANTS
    Transitions = {"New","Resume","Reload","IdleReset","Quit","PiFork"}
    Writers = {"heartbeat","lsp"}
    FixParts = {"entryCapture","handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 3
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

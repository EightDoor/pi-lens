CONSTANTS
    Transitions = {"Dup"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","roleGatedHandoff","processOrderTurn","forwardStale"}
    MaxSteps = 1
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence

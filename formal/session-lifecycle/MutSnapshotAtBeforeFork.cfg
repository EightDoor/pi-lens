\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* D3 check: the G10 slot is filled at session_before_fork, so a read that lands before session_shutdown is missing from the fork.
CONSTANTS
    Transitions = {"Fork"}
    Writers = {"read"}
    FixParts = {"entryCapture","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 1
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

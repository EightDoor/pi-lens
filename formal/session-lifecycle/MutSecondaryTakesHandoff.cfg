\* expect: violated HandoffOnce
\* module: SessionLifecycle
\* A subagent's session_start between /reload's shutdown and start (I6) takes the hand-off slot when beginScope is not role-gated.
CONSTANTS
    Transitions = {"SecStart","Reload"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 2
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

\* expect: violated NoFalseBlock
\* module: SessionLifecycle
\* Design finding (the design as written, all but forwardStale). /reload: a read lands after session_shutdown's snapshot and drops (the conversation is unchanged).
CONSTANTS
    Transitions = {"Reload"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe"}
    MaxSteps = 1
    MaxTurns = 0
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE

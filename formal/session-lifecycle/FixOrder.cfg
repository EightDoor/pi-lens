\* expect: pass
\* module: SessionLifecycle
\* Target design: widget write-order tokens over three turns across /new, /reload (with or without an entry re-evaluation), quit and pi --fork.
CONSTANTS
    Transitions = {"New","Reload","Quit","PiFork"}
    Writers = {"widget"}
    FixParts = {"entryCapture","handoffAtShutdown","roleGatedHandoff","processOrderTurn","dedupe","forwardStale"}
    MaxSteps = 2
    MaxTurns = 3
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE
